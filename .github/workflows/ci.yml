name: CI

# The tests previously ran only because Vercel executes `npm run build`, which
# meant a branch was first verified by deploying it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches engines.node, which is what Vercel deploys with.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npx next build
