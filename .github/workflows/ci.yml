name: CI

# The tests previously ran only because Vercel executes `npm run build`, which
# meant a branch was first verified by deploying it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches engines.node, which is what Vercel deploys with.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npx next build

  # Separate job because it needs a browser, and `npm run build` — which Vercel
  # also runs — must stay installable without one.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npx next build
      - name: Rendering smoke test
        run: npm run test:render
