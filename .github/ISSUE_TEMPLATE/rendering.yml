name: Something rendered wrong
description: A canvas is blank, wrong, slow, or not what the caption says it is
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Every lab writes its controls into the address bar, so the single most
        useful thing you can paste is the URL from the page you were looking at.
        It reconstructs your exact state on my machine.

  - type: dropdown
    id: lab
    attributes:
      label: Which lab
      options:
        - "1 — The Model Matrix (/labs/transform)"
        - "2 — Projection & the Frustum (/labs/projection)"
        - "3 — Coordinate Spaces (/labs/pipeline)"
        - "4 — Light & Normals (/labs/shading)"
        - "5 — Textures & Sampling (/labs/textures)"
        - "6 — Compute & Particles (/labs/compute, WebGPU)"
        - "7 — Draw Calls & Instancing (/labs/instancing, WebGPU)"
        - "8 — Colour & Gamma (/labs/colour)"
        - "9 — Depth & Transparency (/labs/depth)"
        - "10 — Write a Shader (/labs/shader)"
        - "A technology guide (/tech)"
        - "Somewhere else on the site"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: The URL you were on
      description: >-
        Copy it out of the address bar, query string and all, or use the lab's own
        copy-link button. If you moved a control, the query string is the report.
      placeholder: https://www.render-quest.com/labs/depth?near=0.05&separation=0.002
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What the canvas showed, and what you expected
      description: Two sentences is plenty. A screenshot or a short recording helps.
    validations:
      required: true

  - type: dropdown
    id: failure-card
    attributes:
      label: Did the lab show its own failure card?
      description: >-
        Each lab replaces its canvas with a card explaining the failure when it
        knows it has one. Whether you saw that card or a blank rectangle tells me
        which half of the code to look in.
      options:
        - "No — it drew something, and the something was wrong"
        - "No — the area was blank or missing"
        - "Yes — a card appeared saying what went wrong"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141 / Safari 26.1 / Firefox 145
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.4 / Windows 11 / Ubuntu 24.04 / iOS 26
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU
      description: >-
        In a Chromium browser, open chrome://gpu and paste the GPU0 line. Otherwise
        the chip name is enough. Labs 6 and 7 need WebGPU, which a good many
        machines still do not have.
      placeholder: "GPU0: VENDOR = 0x106b, DEVICE = 0xa050, ANGLE Metal Renderer: Apple M2"

  - type: textarea
    id: console
    attributes:
      label: Anything in the browser console
      description: Optional. Paste it as text rather than a screenshot if you can.
      render: text
