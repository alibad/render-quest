<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The site mark (components/site/Mark.tsx) at favicon resolution. The
       frustum fill, the rays and their 0.45 opacity all fall below half a pixel
       at 16px, so only the three things that carry the idea survive: the eye,
       the near plane, the far plane. The dark plate is deliberate — it keeps
       the mark readable on light and dark browser chrome alike, which a
       prefers-color-scheme query inside the file would not do everywhere the
       icon is rasterised. -->
  <rect width="32" height="32" rx="7" fill="#08090b"/>
  <!-- far plane -->
  <path d="M25.4 6 L25.4 26" stroke="#5cc8ff" stroke-width="3" stroke-linecap="round"/>
  <!-- near plane: where the image actually forms -->
  <path d="M14 10.6 L14 21.4" stroke="#e8ebf0" stroke-width="3.2" stroke-linecap="round"/>
  <!-- the eye -->
  <circle cx="6" cy="16" r="2.5" fill="#5cc8ff"/>
</svg>
