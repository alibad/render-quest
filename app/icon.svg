<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#08090b"/>
  <!-- the frustum volume between the near and far planes -->
  <path d="M12.6 11.2 L25.8 4.6 L25.8 27.4 L12.6 20.8 Z" fill="#5cc8ff" fill-opacity="0.15"/>
  <!-- rays from the eye, continuing past the near plane to the far plane -->
  <path d="M5.6 16 L25.8 4.6 M5.6 16 L25.8 27.4" stroke="#5cc8ff" stroke-opacity="0.45" stroke-width="1.15" stroke-linecap="round"/>
  <!-- far plane -->
  <path d="M25.8 4.6 L25.8 27.4" stroke="#5cc8ff" stroke-width="2" stroke-linecap="round"/>
  <!-- near plane: where the image actually forms -->
  <path d="M12.6 11.2 L12.6 20.8" stroke="#e8ebf0" stroke-width="2.9" stroke-linecap="round"/>
  <!-- the eye -->
  <circle cx="5.6" cy="16" r="2.4" fill="#5cc8ff"/>
</svg>
